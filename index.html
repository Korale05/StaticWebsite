<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Download project ZIP files directly from this static website.">
  <title>My File Share</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="card">
      <header class="card-header">
        <h1 class="title">My File Share</h1>
        <p class="subtitle">Select any ZIP file below to download directly to your device.</p>
      </header>

      <!-- Dynamic list of all available ZIP files -->
      <section id="file-list" class="file-list" aria-label="Available ZIP files">
        <!-- Static fallback in case JavaScript is disabled -->
        <noscript>
          <div class="file-item">
            <div class="file-item-left">
              <div class="file-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6a2 2 0 0 0-2 2z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
              </div>
              <div class="file-meta">
                <span class="file-name">Project1ZIP.zip</span>
                <span class="file-size">8.4 MB</span>
              </div>
            </div>
            <a href="files/Project1ZIP.zip" download="Project1ZIP.zip" class="download-btn">
              <span>Download</span>
            </a>
          </div>
          <div class="file-item">
            <div class="file-item-left">
              <div class="file-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6a2 2 0 0 0-2 2z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
              </div>
              <div class="file-meta">
                <span class="file-name">SpringProject_ZIP.zip</span>
                <span class="file-size">31.8 MB</span>
              </div>
            </div>
            <a href="files/SpringProject_ZIP.zip" download="SpringProject_ZIP.zip" class="download-btn">
              <span>Download</span>
            </a>
          </div>
        </noscript>
      </section>

      <footer class="card-footer">
        <p>Direct download • No account required</p>
      </footer>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
